<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meghana | Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: #f4f1ea;
            line-height: 1.6;
        }

        /* NAVBAR */

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(11, 16, 32, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
        }

        .logo span {
            color: #9d8cff;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 28px;
        }

        nav a {
            text-decoration: none;
            color: #c8c8d0;
            transition: 0.3s;
        }

        nav a:hover {
            color: #a99cff;
        }

        /* HERO */

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 8% 60px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            background: #6757d9;
            filter: blur(180px);
            opacity: 0.25;
            top: 10%;
            right: -10%;
        }

        .hero-content {
            max-width: 900px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .tag {
            display: inline-block;
            padding: 8px 16px;
            border: 1px solid #39345c;
            border-radius: 30px;
            color: #b8adff;
            margin-bottom: 25px;
            font-size: 14px;
        }

        h1 {
            font-size: clamp(50px, 9vw, 100px);
            line-height: 0.95;
            margin-bottom: 25px;
        }

        h1 span {
            color: #9d8cff;
        }

        .hero p {
            max-width: 650px;
            margin: auto;
            color: #a8a8b5;
            font-size: 18px;
        }

        .buttons {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;
            padding: 13px 24px;
            border-radius: 10px;
            transition: 0.3s;
            font-weight: bold;
        }

        .primary {
            background: #9d8cff;
            color: #0b1020;
        }

        .primary:hover {
            transform: translateY(-3px);
            background: #b1a5ff;
        }

        .secondary {
            border: 1px solid #393b50;
            color: white;
        }

        .secondary:hover {
            background: #171c32;
        }

        /* GENERAL */

        section {
            padding: 100px 8%;
        }

        .section-title {
            margin-bottom: 50px;
        }

        .section-title small {
            color: #9d8cff;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .section-title h2 {
            font-size: 42px;
            margin-top: 8px;
        }

        .section-title p {
            color: #8f909e;
            max-width: 600px;
        }

        /* ABOUT */

        .about {
            background: #0e1427;
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .about-text p {
            color: #a8a8b5;
            margin-bottom: 20px;
        }

        .facts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .fact {
            padding: 25px;
            background: #151b31;
            border: 1px solid #242a43;
            border-radius: 15px;
        }

        .fact h3 {
            color: #9d8cff;
            margin-bottom: 5px;
        }

        .fact p {
            color: #9294a3;
        }

        /* SKILLS */

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .skill {
            background: #12182c;
            border: 1px solid #242a43;
            padding: 25px;
            border-radius: 16px;
            transition: 0.3s;
        }

        .skill:hover {
            transform: translateY(-7px);
            border-color: #7164bd;
        }

        .skill-icon {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .skill h3 {
            margin-bottom: 8px;
        }

        .skill p {
            color: #888b9b;
            font-size: 14px;
        }

        /* PROJECTS */

        .projects {
            background: #0e1427;
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .project {
            padding: 30px;
            border-radius: 18px;
            background: #151b31;
            border: 1px solid #242a43;
            transition: 0.3s;
        }

        .project:hover {
            transform: translateY(-8px);
            border-color: #7164bd;
        }

        .project-number {
            color: #7668c8;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .project h3 {
            font-size: 23px;
            margin-bottom: 10px;
        }

        .project p {
            color: #9294a3;
            margin-bottom: 20px;
        }

        .tech {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tech span {
            padding: 5px 10px;
            border-radius: 20px;
            background: #222944;
            color: #bbb3ff;
            font-size: 12px;
        }

        /* EDUCATION */

        .timeline {
            max-width: 800px;
            border-left: 2px solid #39345c;
            padding-left: 30px;
        }

        .timeline-item {
            margin-bottom: 40px;
            position: relative;
        }

        .timeline-item::before {
            content: "";
            position: absolute;
            left: -39px;
            top: 6px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #9d8cff;
        }

        .timeline-item small {
            color: #9d8cff;
        }

        .timeline-item h3 {
            margin: 5px 0;
        }

        .timeline-item p {
            color: #9294a3;
        }

        /* CONTACT */

        .contact {
            text-align: center;
        }

        .contact-box {
            max-width: 700px;
            margin: auto;
            padding: 50px;
            background: #151b31;
            border: 1px solid #242a43;
            border-radius: 20px;
        }

        .contact-box p {
            color: #9294a3;
            margin: 15px 0 30px;
        }

            padding:
